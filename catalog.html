<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>도토리 마을 — 생물 한눈에 보기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 30c-6 0-9-6-9-12h18c0 6-3 12-9 12z' fill='%23c98a4b'/%3E%3Cpath d='M5 17c0-6 5-10 11-10s11 4 11 10z' fill='%237a4a2a'/%3E%3Cpath d='M15 3h2v5h-2z' fill='%235a3a22'/%3E%3C/svg%3E">
<style>html,body{margin:0;height:100%;background:#cfe8c0;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
#bar{position:fixed;left:8px;top:8px;background:#fffc;padding:6px 10px;border-radius:8px;font-size:13px;z-index:2}
#bar a{margin-right:8px;color:#3b2a1a}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head><body>
<div id="bar"><a href="?b=fish">물고기</a><a href="?b=bugs">곤충</a><a href="?b=looks">꾸미기</a> · 모든 종을 같은 크기 칸에 맞춰 늘어놓은 것(실제 크기 비율이 아님). 물고기는 옆모습, 곤충과 납작한 생물은 위에서 본 모습, 메뚜기·사마귀 무리는 옆모습. <span id="pg"></span></div>
<script type="module">
// 생물 모델을 종마다 한 칸씩 벽에 걸듯 늘어놓아 생김새를 확인하는 화면.
//   ?b=fish|bugs  &from=0&n=24 (몇 번째부터 몇 종)  &cols=6  &m=id,id (그 종만)
import * as THREE from 'three';
import { loadBundle, loadSingle, make } from './js/gfx/models.js';
import { VERSION } from './js/core/version.js';
const q = new URLSearchParams(location.search);
const b = q.get('b') === 'bugs' ? 'bugs' : q.get('b') === 'looks' ? 'looks' : 'fish';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe8c0);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8e8d0, 2.4));
const sun = new THREE.DirectionalLight(0xfff6e6, 1.6); sun.position.set(-3, 6, 9); scene.add(sun);
let list;
if (b === 'looks') {
  // 꾸미기 부위를 하나씩 바꿔 가며 늘어놓는다.  &part=hair|back|face|wear|hat|color 로 한 갈래만 볼 수 있다
  const LK = await import('./js/game/look.js');
  await loadSingle('./assets/chars/player_custom.glb?v=' + VERSION, LK.MODEL);
  const base = { ...LK.defaultLook(), hat: 0 }, L = [];
  const add = (part, name, look, o = {}) => L.push({ part, name, look: { ...base, ...look }, ...o });
  LK.HAIR.forEach((n, i) => add('hair', n, { hair: i + 1 }));
  LK.HAIR.forEach((n, i) => add('back', n + ' (뒤)', { hair: i + 1 }, { yaw: 2.5 }));
  LK.EYES.forEach((n, i) => add('face', n, { eyes: i + 1, eyec: i % LK.EYEC.length }));
  LK.FACE.forEach((f, i) => add('face', f.ko, { face: i }));
  LK.BROW.forEach((n, i) => add('face', n, { brow: i }));
  LK.NOSE.forEach((n, i) => add('face', n, { nose: i }));
  LK.MOUTH.forEach((n, i) => add('face', n, { mouth: i + 1 }));
  LK.CHEEK.forEach((n, i) => add('face', '볼: ' + n, { cheek: i }));
  LK.GLASS.slice(1).forEach((n, i) => add('face', n, { glass: i + 1 }));
  LK.OUTFIT.forEach((o, i) => add('wear', o.ko, { outfit: i + 1, top: [0, 5, 2, 9, 4, 8][i], bot: [6, 12, 3, 5, 11, 6][i] }));
  LK.OUTFIT.forEach((o, i) => add('wear', o.ko + ' (뒤)', { outfit: i + 1, top: [0, 5, 2, 9, 4, 8][i], bot: [6, 12, 3, 5, 11, 6][i] }, { yaw: 2.6 }));
  LK.HAT.slice(1).forEach((h, i) => add('hat', h.ko, { hat: i + 1, hatc: [3, 0, 5, 7, 8, 8, 4][i], hair: [1, 2, 5, 6, 3, 7, 8][i] }));
  LK.HAT.slice(1).forEach((h, i) => add('hat', h.ko + ' (옆)', { hat: i + 1, hatc: [3, 0, 5, 7, 8, 8, 4][i], hair: [1, 2, 5, 6, 3, 7, 8][i] }, { yaw: -1.2 }));
  LK.SKIN.forEach((c, i) => add('color', '피부 ' + (i + 1), { skin: i, hair: 4, hairc: i % 3 }));
  LK.HAIRC.forEach((c, i) => add('color', '머리색 ' + (i + 1), { hairc: i, hair: 5 }));
  const part = q.get('part');
  list = (part ? L.filter((e) => e.part === part) : L).map((e) => ({ ...e, LK }));
} else {
  await loadBundle('./assets/models/' + b + '.glb');
  list = (await (await fetch('./data/' + b + '.json')).json()).filter((e) => !e.trash);
}
const only = q.get('m'); if (only) list = list.filter((e) => only.split(',').includes(e.id));
const from = +(q.get('from') || 0), n = +(q.get('n') || list.length), cols = +(q.get('cols') || 8);
const total = list.length; list = list.slice(from, from + n);
document.getElementById('pg').textContent = `(${from + 1}~${from + list.length} / ${total}종)`;
const CW = b === 'looks' ? 1.9 : 2.3, CH = b === 'bugs' ? 2.3 : b === 'looks' ? 2.2 : 1.55;
function label(text) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 64;
  const x = c.getContext('2d'); x.font = 'bold 34px "Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif'; x.textAlign = 'center'; x.fillStyle = '#2b3a22'; x.fillText(text, 256, 44);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true })); s.scale.set(CW * 0.98, CW * 0.98 / 8, 1); return s;
}
list.forEach((e, i) => {
  if (b === 'looks') {                                        // 꾸민 주인공 한 명
    const o = make(e.LK.MODEL), g = new THREE.Group();
    e.LK.dress({ parts: o.userData.parts, model: o }, e.look);
    if (o.userData.parts.mouth_open) o.userData.parts.mouth_open.visible = false;
    o.rotation.y = e.yaw ?? 0.3;
    g.add(o);
    g.scale.setScalar(1.12);
    const x = (i % cols) * CW, y = -Math.floor(i / cols) * CH;
    g.position.set(x, y - CH / 2 + 0.42, 0); scene.add(g);
    const l = label(e.name); l.position.set(x, y - CH / 2 + 0.2, 3); scene.add(l);
    return;
  }
  const o = make((b === 'bugs' ? 'bug_' : 'fish_') + e.id), g = new THREE.Group();
  const top = e.look.view ? e.look.view === 'top' : b === 'bugs';
  if (top && e.look.f === 'flat') o.rotation.set(Math.PI / 2, (e.look.flat || 'L') === 'L' ? Math.PI : 0, 0);      // 넙치·가자미: 등지느러미가 위로 오게(넙치는 머리가 왼쪽, 가자미는 오른쪽)
  else if (top) o.rotation.set(Math.PI / 2, Math.PI, 0);  // 등이 화면을 보고 머리가 위로 오게 세운다
  else if (b === 'bugs' && e.look.view === 'side') { o.rotation.order = 'XYZ'; o.rotation.set(0.32, Math.PI / 2 - 0.35, 0); }      // 옆모습(머리가 오른쪽, 살짝 위에서)
  if (q.get('under') && o.userData.parts && o.userData.parts.wing_L) o.rotation.set(-Math.PI / 2, Math.PI, 0);      // &under=1: 배 쪽에서 본 모습(날개 아랫면)
  g.add(o);
  const box = new THREE.Box3().setFromObject(g), sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const s = Math.min((CW - 0.3) / sz.x, (CH - 0.5) / sz.y);
  o.position.sub(c); g.scale.setScalar(s);
  const x = (i % cols) * CW, y = -Math.floor(i / cols) * CH;
  g.position.set(x, y + 0.12, 0); scene.add(g);
  const l = label(e.name); l.position.set(x, y - CH / 2 + 0.2, 0.5); scene.add(l);
});
const rows = Math.ceil(list.length / cols), W = cols * CW, H = rows * CH;
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
function fit() {
  const a = innerWidth / innerHeight, hw = Math.max(W / 2, H / 2 * a) * 1.02, hh = hw / a;
  cam.left = -hw; cam.right = hw; cam.top = hh; cam.bottom = -hh; cam.updateProjectionMatrix();
  cam.position.set((cols - 1) * CW / 2, -(rows - 1) * CH / 2, 30); cam.lookAt((cols - 1) * CW / 2, -(rows - 1) * CH / 2, 0);
  renderer.setSize(innerWidth, innerHeight);
}
fit(); addEventListener('resize', fit);
renderer.setAnimationLoop(() => renderer.render(scene, cam));
document.title = 'ready ' + list.length;
</script></body></html>
